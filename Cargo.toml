[package]
name = "yetAnoterDownloader"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/bencode", "crates/errors", "crates/peer", "crates/torrent", "crates/tracker"]
resolver = "2"

[dependencies]
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7.20"
bencode = {path = "crates/bencode"}
errors = {path = "crates/errors"}
torrent = {path = "crates/torrent"}
tracker = {path = "crates/tracker"}

[workspace.dependencies]
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "signal"] }
sha1 = "0.11.0"
reqwest = "0.13.5"
rand = "0.10.3"
tokio-util = "0.7.20"
futures = "0.3.34"
